<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff69b4">
    <meta name="description" content="Metronoom met maatstaf-tellen en stem">
    <title>Metronoom</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%2300d4ff' width='192' height='192'/><circle cx='96' cy='96' r='60' fill='%230a0e27'/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%2300d4ff' width='180' height='180'/><circle cx='90' cy='90' r='54' fill='%230a0e27'/></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #ff69b4 0%, #ffb6d9 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }
        
        .title {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        
        .display {
            text-align: center;
        }
        
        .bpm-value {
            font-size: 72px;
            font-weight: bold;
            color: #fff;
            line-height: 1;
        }
        
        .bpm-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 8px;
        }
        
        .slider-wrapper {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .slider-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            width: 30px;
            text-align: center;
        }
        
        input[type="range"] {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            cursor: pointer;
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #00d4ff;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }
        
        input[type="range"]:disabled {
            opacity: 0.5;
        }
        
        .beats-display {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        
        .beat-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            font-size: 18px;
            transition: all 0.15s ease;
            color: #fff;
        }
        
        .beat-circle.active {
            background: rgba(255, 255, 255, 0.9);
            color: #ff69b4;
            border-color: #fff;
        }
        
        .toggle-button {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.1);
            font-size: 18px;
            font-weight: 500;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .toggle-button:active {
            transform: scale(0.95);
        }
        
        .toggle-button.running {
            background: rgba(255, 255, 255, 0.9);
            color: #ff69b4;
            border-color: #fff;
        }
        
        .status-text {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            height: 18px;
        }
        
        @media (max-width: 480px) {
            .container {
                gap: 1.5rem;
            }
            
            .title {
                font-size: 28px;
            }
            
            .bpm-value {
                font-size: 56px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Metronoom</h1>
        
        <div class="display">
            <div class="bpm-value" id="bpmDisplay">120</div>
            <div class="bpm-label">BPM</div>
        </div>
        
        <div class="slider-wrapper">
            <span class="slider-label">40</span>
            <input type="range" id="bpmSlider" min="40" max="240" value="120" step="1">
            <span class="slider-label">240</span>
        </div>
        
        <div>
            <div style="font-size: 12px; color: rgba(255, 255, 255, 0.6); text-align: center; margin-bottom: 12px;">Beat in maatstaf</div>
            <div class="beats-display">
                <div class="beat-circle" id="beat1">1</div>
                <div class="beat-circle" id="beat2">2</div>
                <div class="beat-circle" id="beat3">3</div>
                <div class="beat-circle" id="beat4">4</div>
            </div>
        </div>
        
        <button class="toggle-button" id="toggleBtn">START</button>
        
        <div class="status-text" id="status">Geluid + stem: "één", "twee", "drie", "vier"</div>
    </div>

    <script>
        // Service Worker registratie
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW reg failed:', err));
        }

        let isRunning = false;
        let bpm = 120;
        let beatCount = 0;
        let intervalId = null;
        let audioContext = null;

        const bpmDisplay = document.getElementById('bpmDisplay');
        const bpmSlider = document.getElementById('bpmSlider');
        const toggleBtn = document.getElementById('toggleBtn');
        const statusDiv = document.getElementById('status');
        const beatCircles = [
            document.getElementById('beat1'),
            document.getElementById('beat2'),
            document.getElementById('beat3'),
            document.getElementById('beat4')
        ];

        function initAudio() {
            if (!audioContext) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioContext();
            }
        }

        function speakNumber(beatNumber) {
            const words = ['', 'één', 'twee', 'drie', 'vier'];
            const utterance = new SpeechSynthesisUtterance(words[beatNumber]);
            utterance.lang = 'nl-NL';
            utterance.rate = 1.8;
            utterance.pitch = 1.2;
            utterance.volume = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        function playTone(beatNumber) {
            window.speechSynthesis.cancel();
            speakNumber(beatNumber);

            const circleIdx = beatNumber - 1;
            beatCircles[circleIdx].classList.add('active');

            setTimeout(() => {
                beatCircles[circleIdx].classList.remove('active');
            }, 150);
        }

        function startMetronome() {
            isRunning = true;
            beatCount = 0;
            toggleBtn.textContent = 'STOP';
            toggleBtn.classList.add('running');
            bpmSlider.disabled = true;

            playTone(1);
            const interval = (60 / bpm) * 1000;

            intervalId = setInterval(() => {
                beatCount++;
                const beatNumber = ((beatCount - 1) % 4) + 1;
                playTone(beatNumber);
            }, interval);
        }

        function stopMetronome() {
            isRunning = false;
            toggleBtn.textContent = 'START';
            toggleBtn.classList.remove('running');
            bpmSlider.disabled = false;
            clearInterval(intervalId);
            beatCount = 0;
            window.speechSynthesis.cancel();

            beatCircles.forEach(circle => circle.classList.remove('active'));
        }

        toggleBtn.addEventListener('click', () => {
            if (isRunning) {
                stopMetronome();
            } else {
                startMetronome();
            }
        });

        bpmSlider.addEventListener('input', (e) => {
            bpm = parseInt(e.target.value);
            bpmDisplay.textContent = bpm;

            if (isRunning) {
                clearInterval(intervalId);
                const interval = (60 / bpm) * 1000;
                intervalId = setInterval(() => {
                    beatCount++;
                    const beatNumber = ((beatCount - 1) % 4) + 1;
                    playTone(beatNumber);
                }, interval);
            }
        });
    </script>
</body>
</html>
